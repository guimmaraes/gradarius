<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Biorritmo | Gradarius</title>
<meta name="description" content="Veja seus ritmos de energia de hoje e das próximas semanas. Gratuito, sem cadastro.">
<link rel="canonical" href="https://www.gradarius.com.br/servicos/biorritmo/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231e1b3a'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='%23b8934a'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../../fontes/fontes.css">
<link rel="stylesheet" href="estilo.css">
<script>
/* Aplica o tema salvo antes de desenhar a página (evita piscar). */
try { var t = localStorage.getItem('gradarius-tema'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
</head>
<body>

<header class="topo">
  <div class="container topo-in">
    <a class="logo" href="../../index.html" aria-label="Gradarius">Gradar<span>ius</span></a>
    <nav class="topo-acoes">
      <a class="link-voltar" id="t-voltar" href="../../index.html"></a>
      <button class="btn-tema" id="btn-tema" type="button" aria-label="Alternar tema"><span aria-hidden="true">◐</span></button>
    </nav>
  </div>
</header>

<main>
  <section class="hero">
    <div class="container">
      <p class="orn" aria-hidden="true">✦</p>
      <h1 id="t-titulo"></h1>
      <p class="destaque" id="t-destaque"></p>
      <p class="lead" id="t-lead"></p>

      <form class="cartao form" id="form" novalidate>
        <div class="campo">
          <label for="nasc" id="l-nasc"></label>
          <div class="par">
            <input id="nasc" name="nasc" type="text" inputmode="numeric" autocomplete="bday" maxlength="10" aria-describedby="erro-nasc">
            <span class="ou" id="t-ou" aria-hidden="true"></span>
            <input id="nasc-cal" type="date" min="1900-01-01" aria-label="Escolher a data de nascimento no calendário">
          </div>
          <p class="erro" id="erro-nasc" role="alert"></p>
        </div>
        <div class="campo">
          <label for="nome" id="l-nome"></label>
          <input id="nome" type="text" maxlength="40" autocomplete="given-name">
        </div>
        <details class="mais">
          <summary id="l-ref-resumo"></summary>
          <div class="campo">
            <label for="ref" id="l-ref"></label>
            <input id="ref" type="text" inputmode="numeric" maxlength="10" aria-describedby="erro-ref">
            <p class="erro" id="erro-ref" role="alert"></p>
          </div>
        </details>
        <label class="check"><input type="checkbox" id="lembrar"> <span id="l-lembrar"></span></label>
        <button class="btn" type="submit" id="btn-ver"></button>
        <p class="nota" id="t-priv"></p>
      </form>
    </div>
  </section>

  <div id="resultado" hidden>
    <section class="secao">
      <div class="container">
        <h2 id="t-hoje"></h2>
        <p class="sub" id="t-hoje-de"></p>
        <p class="frase-chave" id="t-frase"></p>
        <div class="medidores" id="medidores"></div>

        <details class="profundos" id="profundos">
          <summary id="t-prof"></summary>
          <p class="sub" id="t-prof-texto"></p>
          <div class="medidores" id="medidores-prof"></div>
        </details>
      </div>
    </section>

    <section class="secao alt">
      <div class="container">
        <h2 id="t-graf"></h2>
        <p class="sub" id="t-graf-dica"></p>
        <div class="cartao grafico-cartao">
          <div class="janelas" role="group" id="janelas"></div>
          <div class="grafico" id="grafico" tabindex="0"></div>
          <p class="leitura" id="leitura" aria-live="polite"></p>
          <ul class="legenda" id="legenda"></ul>
        </div>
        <div class="acoes">
          <button class="btn" type="button" id="btn-salvar"></button>
          <button class="btn sec" type="button" id="btn-copiar"></button>
          <label class="check"><input type="checkbox" id="inc-data"> <span id="l-inc-data"></span></label>
        </div>
        <p class="nota" id="msg" role="status"></p>
      </div>
    </section>

    <section class="secao">
      <div class="container">
        <h2 id="t-trans"></h2>
        <p class="sub" id="t-trans-texto"></p>
        <ul class="transicoes" id="transicoes"></ul>
      </div>
    </section>

    <section class="secao" id="sobre-ritmos">
      <div class="container sobre" id="sobre"></div>
    </section>

    <section class="secao alt chamada">
      <div class="container">
        <p class="orn" aria-hidden="true">✦</p>
        <p class="destaque" id="t-chamada"></p>
        <div class="acoes centro">
          <a class="btn" id="btn-mapa" href="#"></a>
          <a class="btn sec" id="btn-consulta" href="#"></a>
        </div>
      </div>
    </section>
  </div>
</main>

<footer class="rodape">
  <div class="container">
    <p id="t-aviso"></p>
    <p class="marca"><span aria-hidden="true">✦</span> Gradar<span class="ouro">ius</span></p>
  </div>
</footer>

<script src="textos.js"></script>
<script src="calculo.js"></script>
<script src="app.js"></script>
</body>
</html>
